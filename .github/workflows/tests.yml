name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install xvfb and Tk
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk

      - name: Run each test module in its own process
        run: bash scripts/run-tests.sh
